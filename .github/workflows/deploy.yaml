name: Build and Deploy

on:
  push:
    branches:
      - feature/*
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: 'recursive'

      - name: Install project Python dependencies
        run: pip install --no-cache-dir -c constraints.txt -r requirements.txt

      - name: Build firmware
        run: |
          idf.py \
            -DBUILD_STAGE=${{ vars.BUILD_STAGE || 'dev' }} \
            -DCMAKE_BUILD_TYPE=Release \
            build

      - name: Package deploy artifact
        run: cd build && ninja deploy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy.zip
          path: build/deploy.zip

  deploy:
    # if: github.event.pull_request.merged == true
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      STAGE: ${{ vars.BUILD_STAGE || 'dev' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy.zip
          path: ./

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Sync firmware to S3
        run: |
          aws s3 cp deploy.zip ${{ vars.AWS_OTA_BUCKET_URI }}/deploy/coffee-drivah/firmware.zip
