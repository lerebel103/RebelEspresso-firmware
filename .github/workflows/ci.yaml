name: CI

on:
  push:
    branches: [main, feature/*]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_STAGE: dev
  CMAKE_BUILD_TYPE: Release
  IDF_PATH: /opt/esp/idf

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends clang-tidy clang-format
          rm -rf /var/lib/apt/lists/*

      - name: Build (needed for compile_commands.json)
        run: |
          . $IDF_PATH/export.sh
          rm -f dependencies.lock
          idf.py -DBUILD_STAGE=$BUILD_STAGE -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE build

      - name: Check formatting
        run: |
          find components/rebel-espresso/src components/esp-connectivity/src main \
            \( -name '*.cpp' -o -name '*.c' -o -name '*.h' \) | xargs clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: |
          . $IDF_PATH/export.sh
          ./scripts/lint.sh

  test:
    name: Unit Tests (QEMU)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build test app
        working-directory: test_app
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Run tests in QEMU
        working-directory: test_app
        run: |
          . $IDF_PATH/export.sh
          rm -f build/qemu_flash.bin
          ./run_qemu.sh

  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    needs: [lint, test]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          rm -f dependencies.lock
          idf.py \
            -DBUILD_STAGE=${{ vars.BUILD_STAGE || 'dev' }} \
            -DCMAKE_BUILD_TYPE=Release \
            build

      - name: Verify binary fits OTA partition
        run: |
          FW_BIN=$(find build/deploy/firmware -maxdepth 1 -type f -name '*-v*.bin' | head -n1)
          if [ -z "$FW_BIN" ]; then
            echo "ERROR: Versioned firmware .bin not found in deploy output"
            ls -la build/deploy/firmware
            exit 1
          fi
          SIZE=$(stat -c%s "$FW_BIN")
          MAX=$((2000 * 1024))
          echo "Firmware artifact: $FW_BIN"
          echo "Firmware size: $SIZE bytes (max: $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: Firmware exceeds OTA partition limit!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/deploy.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: deploy.zip
