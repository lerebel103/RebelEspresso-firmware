steps:
  # See https://cloud.google.com/cloud-build/docs/access-private-github-repos
  # Also need 'gcloud config set gcloudignore/enabled false'
  # and don't forget to add a .gcloudignore file with "!.git" in it
  #
  # Also enable container caching
  # gcloud config set builds/use_kaniko True
  #
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: 'bash'
    args: [ '-c', 'gcloud secrets versions access latest --secret=github-rsa-key > /root/.ssh/id_github' ]
    volumes:
      - name: 'ssh'
        path: /root/.ssh
  # Set up git with key and domain
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        chmod 600 /root/.ssh/id_github
        cat <<EOF >/root/.ssh/config
        Hostname github.com
        IdentityFile /root/.ssh/id_github
        EOF
        ssh-keyscan -t rsa github.com > /root/.ssh/known_hosts
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # git config pull.ff only
  # checkout git submodules
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # get the .git directory
        git config pull.ff only
        git clone --branch $BRANCH_NAME git@github.com:lerebel103/$REPO_NAME.git /tmp/repo
        cp -r /tmp/repo/.git . && rm -fr /tmp/repo/.git
        git pull --unshallow
        git submodule update --init --recursive
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # Now build project
  - name: 'gcr.io/$PROJECT_ID/rebelespresso-fw-build:latest'
    args: ['ci/build.sh']
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # Place artifacts on GS
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['-m', 'cp', '-r', 'build-*/firmware/*/', 'gs://rebelthings-firmware/release']

  timeout: '1800s'
